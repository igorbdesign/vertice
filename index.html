<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vértice — Painel do Designer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="css/styles.css?v=6">
</head>
<body>
<div id="app">
  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <div class="brand-mark">V</div>
      <div class="brand-text"><span class="brand-name">Vértice</span><span class="brand-sub">painel do designer</span></div>
      <button class="icon-btn" id="btnCollapseSidebar" title="Recolher menu">«</button>
    </div>
    <div class="sidebar-hint" id="sidebarHint">Arraste para reordenar</div>
    <nav id="navList" class="nav-list"></nav>
    <div class="sidebar-foot">
      <button class="btn ghost small" id="btnReorderMode">Reorganizar menu</button>
      <span id="appVersion" style="display:block;font-size:10px;color:var(--muted-2);margin-top:6px;text-align:center"></span>
    </div>
  </aside>
  <main id="main" class="main">
    <header class="topbar">
      <button class="icon-btn mobile-only" id="btnToggleSidebar">☰</button>
      <h1 class="page-title" id="pageTitle">Dashboard</h1>
      <div class="topbar-right">
        <span class="today-label" id="todayLabel"></span>
        <div class="alert-wrap">
          <button class="icon-btn bell" id="btnAlerts" title="Avisos">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="badge" id="alertBadge" hidden>0</span>
          </button>
          <div class="alert-dropdown" id="alertDropdown" hidden></div>
        </div>
      </div>
    </header>
    <div class="page" id="pageRoot"></div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script src="js/store.js?v=6"></script>
<script src="js/ui.js?v=6"></script>
<script src="js/alerts.js?v=6"></script>
<script src="js/sidebar.js?v=6"></script>
<script src="js/pages/dashboard.js?v=6"></script>
<script src="js/pages/clients.js?v=6"></script>
<script src="js/pages/services.js?v=6"></script>
<script src="js/pages/contracts.js?v=6"></script>
<script src="js/pages/finance.js?v=6"></script>
<script src="js/pages/goals.js?v=6"></script>
<script src="js/pages/tasks.js?v=6"></script>
<script src="js/pages/habits.js?v=6"></script>
<script src="js/pages/wishlist.js?v=6"></script>
<script src="js/pages/projects.js?v=6"></script>
<script src="js/pages/calendar.js?v=6"></script>
<script src="js/pages/moments.js?v=6"></script>
<script src="js/pages/prospection.js?v=6"></script>
<script src="js/pages/content.js?v=6"></script>
<script src="js/app.js?v=6"></script>
</body>
</html>
